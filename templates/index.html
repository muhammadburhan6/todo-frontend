<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App - Authentication & Tasks</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      padding: 32px 28px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 6px;
    }

    .header p {
      color: #94a3b8;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      background: #0f172a;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: #2563eb;
      color: #ffffff;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 500;
      color: #cbd5e1;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #38bdf8;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background: #1d4ed8;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 13px;
      display: none;
      line-height: 1.4;
    }

    .message.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
    }

    .message.success {
      display: block;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid #22c55e;
      color: #86efac;
    }

    /* Dashboard view */
    .dashboard {
      display: none;
    }

    .user-info-box {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-info-box div p {
      font-size: 13px;
      color: #94a3b8;
    }

    .user-info-box div h3 {
      font-size: 15px;
      color: #38bdf8;
      font-weight: 600;
      margin-top: 2px;
    }

    .logout-btn {
      padding: 8px 14px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .logout-btn:hover {
      background: #dc2626;
    }

    /* Tasks Section */
    .tasks-section {
      margin-top: 20px;
    }

    .tasks-section h2 {
      font-size: 18px;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 12px;
    }

    .add-task-form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .add-task-form input {
      flex: 1;
      padding: 10px 14px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }

    .add-task-form input:focus {
      border-color: #38bdf8;
    }

    .add-task-form button {
      padding: 10px 16px;
      background: #10b981;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .add-task-form button:hover {
      background: #059669;
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 12px 14px;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .task-item:hover {
      border-color: #475569;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      cursor: pointer;
    }

    .task-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #38bdf8;
    }

    .task-title {
      font-size: 14px;
      color: #f1f5f9;
      word-break: break-all;
    }

    .task-title.completed {
      text-decoration: line-through;
      color: #64748b;
    }

    .task-delete-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 16px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: color 0.2s, background 0.2s;
    }

    .task-delete-btn:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
    }

    .empty-state {
      text-align: center;
      padding: 24px 12px;
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🚀 Todo App Auth</h1>
      <p id="sub-header">Login or create an account to manage your tasks</p>
    </div>

    <div id="alert-box" class="message"></div>

    <!-- Auth Forms (Shown when Logged Out) -->
    <div id="auth-section">
      <div class="tabs">
        <button id="tab-login" class="tab-btn active" onclick="switchTab('login')">Login</button>
        <button id="tab-signup" class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <form id="auth-form" onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" required placeholder="name@example.com">
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
        </div>

        <button type="submit" id="submit-btn" class="submit-btn">Login</button>
      </form>
    </div>

    <!-- Logged In Dashboard (Only Shown when Logged In) -->
    <div id="dashboard-section" class="dashboard">
      <div class="user-info-box">
        <div>
          <p>Logged in as</p>
          <h3 id="user-email"></h3>
        </div>
        <button class="logout-btn" onclick="handleLogout()">Logout</button>
      </div>

      <!-- Tasks Protected Area -->
      <div class="tasks-section">
        <h2>My Tasks (Protected with JWT)</h2>

        <form class="add-task-form" onsubmit="handleAddTask(event)">
          <input type="text" id="new-task-title" required placeholder="What needs to be done?">
          <button type="submit">+ Add Task</button>
        </form>

        <ul class="task-list" id="task-list"></ul>
      </div>
    </div>
  </div>

  <script>
    let currentMode = 'login';
    let currentToken = '';

    function switchTab(mode) {
      currentMode = mode;
      hideAlert();
      const loginTab = document.getElementById('tab-login');
      const signupTab = document.getElementById('tab-signup');
      const submitBtn = document.getElementById('submit-btn');
      const subHeader = document.getElementById('sub-header');

      if (mode === 'login') {
        loginTab.classList.add('active');
        signupTab.classList.remove('active');
        submitBtn.textContent = 'Login';
        subHeader.textContent = 'Enter your credentials to login';
      } else {
        signupTab.classList.add('active');
        loginTab.classList.remove('active');
        submitBtn.textContent = 'Create Account';
        subHeader.textContent = 'Register a new account with email & password';
      }
    }

    function showAlert(msg, isError = false) {
      const box = document.getElementById('alert-box');
      box.textContent = msg;
      box.className = isError ? 'message error' : 'message success';
    }

    function hideAlert() {
      const box = document.getElementById('alert-box');
      box.className = 'message';
      box.textContent = '';
    }

    // AUTH SUBMISSION (LOGIN / SIGNUP)
    async function handleSubmit(e) {
      e.preventDefault();
      hideAlert();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const endpoint = currentMode === 'login' ? '/login' : '/signup';

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          showAlert(data.message || 'Operation failed', true);
          return;
        }

        currentToken = data.token;
        localStorage.setItem('auth_token', data.token);
        localStorage.setItem('auth_user', JSON.stringify(data.user));

        showAlert(currentMode === 'login' ? 'Login successful!' : 'Account created successfully!');
        showDashboard(data.user, data.token);
      } catch (err) {
        showAlert('Could not connect to the server: ' + err.message, true);
      }
    }

    function showDashboard(user, token) {
      currentToken = token;
      document.getElementById('auth-section').style.display = 'none';
      document.getElementById('dashboard-section').style.display = 'block';
      document.getElementById('user-email').textContent = user.email;
      document.getElementById('sub-header').textContent = 'Manage your private tasks';
      loadTasks();
    }

    function handleLogout() {
      currentToken = '';
      localStorage.removeItem('auth_token');
      localStorage.removeItem('auth_user');
      document.getElementById('auth-section').style.display = 'block';
      document.getElementById('dashboard-section').style.display = 'none';
      document.getElementById('task-list').innerHTML = '';
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
      hideAlert();
      switchTab('login');
    }

    // TASK MANAGEMENT (AUTHENTICATED VIA JWT BEARER)
    async function loadTasks() {
      if (!currentToken) return;

      try {
        const res = await fetch('/tasks', {
          headers: { 'Authorization': 'Bearer ' + currentToken }
        });

        if (res.status === 401) {
          showAlert('Session expired. Please login again.', true);
          handleLogout();
          return;
        }

        const tasks = await res.json();
        renderTasks(tasks);
      } catch (err) {
        console.error('Error fetching tasks:', err);
      }
    }

    function renderTasks(tasks) {
      const list = document.getElementById('task-list');
      list.innerHTML = '';

      if (!tasks || tasks.length === 0) {
        list.innerHTML = '<li class="empty-state">No tasks yet. Add one above!</li>';
        return;
      }

      tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = 'task-item';

        li.innerHTML = `
          <div class="task-left" onclick="toggleTask(${task.id}, ${!task.completed})">
            <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onclick="event.stopPropagation(); toggleTask(${task.id}, ${!task.completed})">
            <span class="task-title ${task.completed ? 'completed' : ''}">${escapeHtml(task.title)}</span>
          </div>
          <button class="task-delete-btn" title="Delete Task" onclick="deleteTask(${task.id})">✕</button>
        `;

        list.appendChild(li);
      });
    }

    async function handleAddTask(e) {
      e.preventDefault();
      const input = document.getElementById('new-task-title');
      const title = input.value.trim();
      if (!title) return;

      try {
        const res = await fetch('/tasks', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + currentToken
          },
          body: JSON.stringify({ title })
        });

        if (res.ok) {
          input.value = '';
          loadTasks();
        } else {
          const err = await res.json();
          showAlert(err.message || 'Failed to add task', true);
        }
      } catch (err) {
        showAlert('Network error: ' + err.message, true);
      }
    }

    async function toggleTask(taskId, newCompleted) {
      try {
        const res = await fetch(`/tasks/${taskId}`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + currentToken
          },
          body: JSON.stringify({ completed: newCompleted })
        });

        if (res.ok) {
          loadTasks();
        } else {
          const err = await res.json();
          showAlert(err.message || 'Failed to update task', true);
        }
      } catch (err) {
        showAlert('Network error: ' + err.message, true);
      }
    }

    async function deleteTask(taskId) {
      try {
        const res = await fetch(`/tasks/${taskId}`, {
          method: 'DELETE',
          headers: {
            'Authorization': 'Bearer ' + currentToken
          }
        });

        if (res.ok) {
          loadTasks();
        } else {
          const err = await res.json();
          showAlert(err.message || 'Failed to delete task', true);
        }
      } catch (err) {
        showAlert('Network error: ' + err.message, true);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Auto-login if token saved
    window.onload = function() {
      const savedToken = localStorage.getItem('auth_token');
      const savedUser = localStorage.getItem('auth_user');
      if (savedToken && savedUser) {
        try {
          showDashboard(JSON.parse(savedUser), savedToken);
        } catch (_) {
          handleLogout();
        }
      }
    };
  </script>
</body>
</html>
